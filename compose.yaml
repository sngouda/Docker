
services:
 
  mysql-db:
 
    image: mysql:8.0
 
    container_name: mysql-db
 
    restart: always
 
    environment:

      MYSQL_ROOT_PASSWORD: root123

      MYSQL_DATABASE: employees
 
    volumes:

      - mysql-data:/var/lib/mysql
 
    networks:

      - backend-network
 
  monitoring-api:
 
    build: ./api
 
    container_name: monitoring-api
 
    restart: always
 
    depends_on:

      - mysql-db
 
    networks:

      - backend-network

      - frontend-network
 
  nginx:
 
    image: nginx:latest
 
    container_name: nginx
 
    restart: always
 
    ports:

      - "80:80"
 
    volumes:

      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
 
    depends_on:

      - monitoring-api
 
    networks:

      - frontend-network
 
volumes:
 
  mysql-data:
 
networks:
 
  frontend-network:
 
  backend-network:
 
